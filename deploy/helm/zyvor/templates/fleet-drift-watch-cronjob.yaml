{{- if .Values.fleetWatch.enabled }}
{{- if .Values.persistence.vmImages.hostPath }}
{{- fail "fleetWatch.enabled requires PVC-backed persistence.vmImages (unset hostPath)" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zyvor-fleet-baseline
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zyvor
    app.kubernetes.io/component: fleet-watch
spec:
  accessModes:
    - {{ .Values.fleetWatch.baseline.accessMode }}
  resources:
    requests:
      storage: {{ .Values.fleetWatch.baseline.size }}
  {{- if .Values.fleetWatch.baseline.storageClass }}
  storageClassName: {{ .Values.fleetWatch.baseline.storageClass | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zyvor-fleet-watch
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: zyvor
    app.kubernetes.io/component: fleet-watch
spec:
  schedule: {{ .Values.fleetWatch.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zyvor
            app.kubernetes.io/component: fleet-watch
        spec:
          restartPolicy: Never
          containers:
            - name: fleet-watch
              image: {{ .Values.fleetWatch.image | quote }}
              env:
                - name: GUESTKIT_FLEET_BASELINE_DIR
                  value: /baseline
              args:
                - fleet
                - watch
                - /images
                {{- if .Values.fleetWatch.recursive }}
                - --recursive
                {{- end }}
                {{- if .Values.fleetWatch.failOnDrift }}
                - --fail-on-drift
                {{- end }}
              volumeMounts:
                - name: images
                  mountPath: /images
                  readOnly: true
                - name: baseline
                  mountPath: /baseline
          volumes:
            - name: images
              persistentVolumeClaim:
                claimName: zyvor-image-store
            - name: baseline
              persistentVolumeClaim:
                claimName: zyvor-fleet-baseline
{{- end }}
